name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # cutadapt (used by --trim) is on PyPI
      - run: pip install -e .[dev] cutadapt
      - run: pytest -q
